# Run the test suite on GitHub's servers on every push, to any branch.
# Lean install (requirements-test.txt) and no AWS access, so tests/test_smoke.py is skipped:
# it needs the private training data in S3.
name: CI

on: push

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Python 3.12 (same as the Lambda image)
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          # Reuse downloaded packages between runs; a change to either file starts a fresh cache
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install the serving packages plus pytest and httpx2
        run: pip install -r requirements-test.txt

      - name: Run the tests
        # -rs lists the skipped tests and why at the end of the log
        run: pytest -rs
