<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stellar Classifier</title>
<style>
  :root {
    --bg: #f7f7f5; --card: #ffffff; --text: #1d1d1f; --muted: #6b6b70; --border: #dcdcdf;
    --accent: #3b5bdb; --accent-text: #ffffff; --bar-bg: #ececef; --error: #c92a2a; --warn: #9c6500;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416; --card: #1e1e21; --text: #ececf0; --muted: #9a9aa3; --border: #34343a;
      --accent: #748ffc; --accent-text: #0d0d10; --bar-bg: #2c2c31; --error: #ff8787; --warn: #ffc078;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 16px; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  p.lede { color: var(--muted); margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  .examples { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .examples span { color: var(--muted); align-self: center; margin-right: 4px; }
  .inputs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 4px; text-align: center; }
  input {
    width: 100%; padding: 8px 6px; font: inherit; text-align: center; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  }
  button {
    font: inherit; cursor: pointer; border-radius: 8px; padding: 6px 12px;
    background: transparent; color: var(--text); border: 1px solid var(--border);
  }
  button.primary { width: 100%; margin-top: 16px; padding: 10px; background: var(--accent); color: var(--accent-text); border: none; font-weight: 600; }
  button:disabled { opacity: 0.6; cursor: wait; }
  .verdict { font-size: 1.4rem; font-weight: 700; margin: 0 0 12px; }
  .row { display: grid; grid-template-columns: 70px 1fr 56px; align-items: center; gap: 8px; margin: 6px 0; }
  .bar { height: 10px; background: var(--bar-bg); border-radius: 5px; overflow: hidden; }
  .bar div { height: 100%; background: var(--accent); }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .meta { color: var(--muted); font-size: 0.85rem; margin-top: 12px; }
  .error { color: var(--error); }
  .warnings { color: var(--warn); font-size: 0.9rem; margin: 12px 0 0; padding-left: 18px; }
  footer { color: var(--muted); font-size: 0.85rem; }
  footer a { color: inherit; }
  @media (max-width: 420px) { .inputs { grid-template-columns: repeat(3, 1fr); } }
</style>
</head>
<body>
<main>
  <h1>Star, galaxy or quasar?</h1>
  <p class="lede">Enter an object's brightness in the five SDSS filters (magnitudes; smaller means brighter).</p>

  <div class="card">
    <div class="examples">
      <span>Try:</span>
      <button type="button" data-example="star">Star</button>
      <button type="button" data-example="galaxy">Galaxy</button>
      <button type="button" data-example="quasar">Quasar</button>
    </div>
    <form id="form">
      <div class="inputs">
        <div><label for="u">u</label><input id="u" type="number" step="any" required></div>
        <div><label for="g">g</label><input id="g" type="number" step="any" required></div>
        <div><label for="r">r</label><input id="r" type="number" step="any" required></div>
        <div><label for="i">i</label><input id="i" type="number" step="any" required></div>
        <div><label for="z">z</label><input id="z" type="number" step="any" required></div>
      </div>
      <button class="primary" type="submit" id="submit">Predict</button>
    </form>
  </div>

  <div class="card" id="result" hidden></div>

  <footer>API: <a href="/docs">/docs</a> · <a href="/health">/health</a></footer>
</main>

<script>
  const FILTERS = ['u', 'g', 'r', 'i', 'z'];
  // Real SDSS test-set objects that the model classifies confidently
  const EXAMPLES = {
    star:   { u: 21.481, g: 20.110, r: 19.479, i: 19.276, z: 19.240 },
    galaxy: { u: 22.345, g: 20.897, r: 19.409, i: 18.837, z: 18.491 },
    quasar: { u: 21.348, g: 21.264, r: 20.892, i: 20.939, z: 20.794 },
  };
  const NAMES = { GALAXY: 'Galaxy', STAR: 'Star', QSO: 'Quasar' };

  const form = document.getElementById('form');
  const submit = document.getElementById('submit');
  const result = document.getElementById('result');

  document.querySelectorAll('[data-example]').forEach(button => {
    button.addEventListener('click', () => {
      const values = EXAMPLES[button.dataset.example];
      FILTERS.forEach(f => { document.getElementById(f).value = values[f]; });
    });
  });

  form.addEventListener('submit', async event => {
    event.preventDefault();
    const object = {};
    FILTERS.forEach(f => { object[f] = Number(document.getElementById(f).value); });

    submit.disabled = true;
    try {
      const response = await fetch('/predict', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ objects: [object] }),
      });
      const body = await response.json();
      if (!response.ok) {
        // 422: FastAPI lists what was wrong with the input
        const reasons = Array.isArray(body.detail) ? body.detail.map(d => d.msg).join('; ') : response.statusText;
        showError(`Invalid input: ${reasons}`);
        return;
      }
      showPrediction(body.predictions[0], body.model_version);
    } catch (err) {
      showError('Could not reach the API. Try again in a moment.');
    } finally {
      submit.disabled = false;
    }
  });

  function showPrediction(prediction, version) {
    const rows = Object.entries(prediction.probabilities)
      .sort((a, b) => b[1] - a[1])
      .map(([cls, p]) => `
        <div class="row">
          <span>${NAMES[cls] || cls}</span>
          <div class="bar"><div style="width:${(p * 100).toFixed(1)}%"></div></div>
          <span class="num">${(p * 100).toFixed(1)}%</span>
        </div>`).join('');
    result.innerHTML = `
      <p class="verdict">${NAMES[prediction.predicted_class] || prediction.predicted_class}</p>
      ${rows}
      <p class="meta">Model version ${version}</p>`;
    // Inputs outside the training range: the answer above is less trustworthy
    if (prediction.warnings && prediction.warnings.length) {
      const list = document.createElement('ul');
      list.className = 'warnings';
      prediction.warnings.forEach(w => {
        const item = document.createElement('li');
        item.textContent = w;
        list.appendChild(item);
      });
      result.querySelector('.meta').before(list);
    }
    result.hidden = false;
  }

  function showError(message) {
    result.innerHTML = `<p class="error"></p>`;
    result.querySelector('.error').textContent = message;
    result.hidden = false;
  }
</script>
</body>
</html>
